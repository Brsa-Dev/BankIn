<h2 mat-dialog-title>Ajouter un objectif</h2>

<mat-dialog-content>
  <div class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Nom de l'objectif</mat-label>
      <input matInput [(ngModel)]="name" placeholder="Voyage au Japon" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Montant cible</mat-label>
      <input matInput type="number" [(ngModel)]="targetAmount" placeholder="5000" />
      <span matSuffix>€</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Montant actuel</mat-label>
      <input matInput type="number" [(ngModel)]="currentAmount" placeholder="0" />
      <span matSuffix>€</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date limite (optionnel)</mat-label>
      <input matInput type="date" [(ngModel)]="deadline" />
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-flat-button class="btn-confirm" (click)="confirm()" [disabled]="!name || !targetAmount">
    Ajouter
  </button>
</mat-dialog-actions>
