<h2 mat-dialog-title>Ajouter une transaction</h2>

<mat-dialog-content>
  <div class="form">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Libellé</mat-label>
      <input matInput [(ngModel)]="label" placeholder="Courses Carrefour" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Type</mat-label>
      <mat-select [(ngModel)]="type">
        <mat-option *ngFor="let t of transactionTypes" [value]="t.value">
          {{ t.label }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Montant</mat-label>
      <input matInput type="number" [(ngModel)]="amount" placeholder="0" />
      <span matSuffix>€</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Date</mat-label>
      <input matInput type="date" [(ngModel)]="date" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Compte</mat-label>
      <mat-select [(ngModel)]="accountId">
        <mat-option *ngFor="let a of accounts" [value]="a.id">
          {{ a.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-flat-button class="btn-confirm" (click)="confirm()" [disabled]="!label || !amount || !accountId">
    Ajouter
  </button>
</mat-dialog-actions>
