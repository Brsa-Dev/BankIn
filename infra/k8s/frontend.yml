apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bankin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: frontend
          image: ghcr.io/brsa-dev/bankin-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: bankin
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80