apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: bankin
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/brsa-dev/bankin-api:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankin-secrets
                  key: DATABASE_URL
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: bankin-secrets
                  key: JWT_SECRET
            - name: RUST_SERVICE_URL
              value: rust-services:50051
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: bankin
spec:
  selector:
    app: api
  ports:
    - port: 3000
      targetPort: 3000