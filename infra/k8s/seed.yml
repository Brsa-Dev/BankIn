apiVersion: batch/v1
kind: Job
metadata:
  name: prisma-seed
  namespace: bankin
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: seed
          image: ghcr.io/brsa-dev/bankin-api:latest
          command: ["node", "dist/prisma/seed.js"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: bankin-secrets
                  key: DATABASE_URL
      restartPolicy: Never