services:
  postgres:
    image: postgres:16
    container_name: bankin-postgres
    environment:
      POSTGRES_USER: bankin
      POSTGRES_PASSWORD: bankin
      POSTGRES_DB: bankin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bankin-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bankin-api
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://bankin:bankin@postgres:5432/bankin
      JWT_SECRET: une_cle_secrete_longue_et_complexe
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data: